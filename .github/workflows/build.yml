name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml
      - build
      - config.env
      - patches/**

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Build
        id: build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          source config.env
          mkdir -p "$RUNNER_TEMP/toolchain"
          for file in go.mod go.sum .github/workflows/build.yml; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/SagerNet/sing-box/$SING_BOX_TAG/$file" \
              --output "$RUNNER_TEMP/toolchain/${file##*/}"
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            printf '%s\n' \
              "tag=$SING_BOX_TAG" \
              "toolchain=$RUNNER_TEMP/toolchain" \
              "tmp=$RUNNER_TEMP" \
              "keystore=$RUNNER_TEMP/release.keystore"
            sed -n '0,/^[[:space:]]*ndk-version: /s//ndk-version=/p' \
              "$RUNNER_TEMP/toolchain/build.yml"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.build.outputs.toolchain }}/go.mod
          cache-dependency-path: ${{ steps.build.outputs.toolchain }}/go.sum

      - name: Setup Go Paths
        id: go
        run: |
          go env -json GOCACHE GOMODCACHE GOPATH |
            jq -r '"go-cache=\(.GOCACHE)", "go-mod-cache=\(.GOMODCACHE)", "go-path=\(.GOPATH)"' >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.build.outputs.ndk-version }}

      - name: Build
        env:
          BUILD_TMP: ${{ steps.build.outputs.tmp }}
          ANDROID_KEYSTORE: ${{ steps.build.outputs.keystore }}
          GOCACHE: ${{ steps.go.outputs.go-cache }}
          GOMODCACHE: ${{ steps.go.outputs.go-mod-cache }}
          GOPATH: ${{ steps.go.outputs.go-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          SFA_UPDATE_REPOSITORY: ${{ github.repository }}
          LOCAL_PROPERTIES: ${{ secrets.ANDROID_LOCAL_PROPERTIES }}
        run: bash build

      - name: Release
        env:
          BUILD_TAG: ${{ steps.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            gh release create "$BUILD_TAG" \
              --title "sing-box for Android $BUILD_TAG" \
              --notes "Built from SagerNet/sing-box $BUILD_TAG."
          fi
          gh release upload "$BUILD_TAG" dist/* --clobber
